# Configuração única do experimento. Caminhos relativos à raiz do repositório.

asset:
  ticker: BOVA11.SA        # código no Yahoo Finance
  b3_code: BOVA11          # CODNEG nas séries históricas da B3
  b3_market_type: "010"    # TPMERC 010 = mercado à vista

data:
  start: "2018-01-01"
  # Último pregão completo, congelado após a coleta. null = resolver na coleta
  # (último pregão completo até a data/hora da execução).
  end: "2026-11-06"        # congelada na coleta de 2026-11-09 18:49 (America/Sao_Paulo)
  interval: 1d
  timezone: America/Sao_Paulo
  cutoff_hour: 19          # antes desta hora local, o pregão do dia é tratado como incompleto
  yfinance:
    auto_adjust: false
    actions: true
    repair: false
  b3_url_template: "https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A{year}.ZIP"
  raw_dir: data/raw
  processed_dir: data/processed
  # Nome do snapshot bruto yfinance em uso (em data/raw/yfinance). null = o mais recente.
  yfinance_snapshot: BOVA11.SA_1d_2018-01-01_2026-11-06_20261109T214907Z.csv

validation:
  price_tolerance: 0.01    # R$ por cota, comparação yfinance x B3
  extreme_log_return: 0.08 # |ln(C_t/C_{t-1})| acima disto é sinalizado
  max_gap_days: 4          # dias corridos entre pregões consecutivos acima disto são sinalizados

features:
  source: b3               # série de análise: b3 (OHLCV oficial) | yfinance (sensibilidade)
  price_column: close      # fechamento não ajustado (sem eventos corporativos no período)
  volume_column: volume    # quantidade de cotas negociadas
  window: 20
  columns: [log_return, volatility_20, dist_sma_20, rel_volume_20]

split:
  train: 0.70
  validation: 0.15
  test: 0.15

outputs:
  figures_dir: reports/figures
  artifacts_dir: artifacts

random_state: 42
